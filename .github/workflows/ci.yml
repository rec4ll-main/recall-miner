name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        # CGO is required by the DuckDB heartbeat sink; ubuntu-latest ships gcc.
        timeout-minutes: 10
        run: go test -short -race -count=1 -timeout 8m ./...

      - name: Module tidy check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  inference-service:
    name: inference sidecar (python 3.12, no ML stack)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: internal/services/inference
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Clean-image import smoke
        run: bash smoke_import.sh

      - name: Unit tests
        # These tests stub the model libraries; the real models are exercised by the
        # compose end-to-end run, not in CI.
        timeout-minutes: 5
        run: python -m unittest discover -s . -p 'test_*.py' -v
